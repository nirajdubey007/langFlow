apiVersion: v1
kind: ConfigMap
metadata:
  name: langflow-config
  namespace: prod
  labels:
    app: langflow-api-prod
data:
  LANGFLOW_HOST: "0.0.0.0"
  LANGFLOW_PORT: "7860"
  LANGFLOW_CONFIG_DIR: "/app/langflow"
  LANGFLOW_AUTO_LOGIN: "false"
  DO_NOT_TRACK: "true"
  LANGFLOW_CORS_ORIGINS: "*"
  LANGFLOW_CORS_ALLOW_CREDENTIALS: "true"
  LANGFLOW_LOG_LEVEL: "info"
  LANGFLOW_WORKERS: "2"
  LANGFLOW_WORKER_TIMEOUT: "300"
  LANGFLOW_CACHE_TYPE: "async"
  LANGFLOW_STORE: "true"
  LANGFLOW_STORE_ENVIRONMENT_VARIABLES: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-secret
  namespace: prod
  labels:
    app: langflow-api-prod
type: Opaque
stringData:
  LANGFLOW_SUPERUSER: "admin"
  LANGFLOW_SUPERUSER_PASSWORD: "ChangeThisPassword123!"  # CHANGE THIS!
  LANGFLOW_SECRET_KEY: "CHANGE_THIS_TO_RANDOM_SECRET_KEY_openssl_rand_hex_32"  # CHANGE THIS!
  
  # Database connection - uses postgres-service for communication
  LANGFLOW_DATABASE_URL: "postgresql://langflow:ChangeMeToStrongPassword123!@postgres-service:5432/langflow"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-data-pvc
  namespace: prod
  labels:
    app: langflow-api-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-logs-pvc
  namespace: prod
  labels:
    app: langflow-api-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow-api-prod
  namespace: prod
  labels:
    app: langflow-api-prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: langflow-api-prod
  template:
    metadata:
      labels:
        app: langflow-api-prod
    spec:
      # Wait for PostgreSQL to be ready before starting
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z postgres-service 5432; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
            echo "PostgreSQL is ready! Starting Langflow..."
      
      containers:
      - name: langflow
        image: cera123/langflow:latest  # Pull from Docker Hub
        imagePullPolicy: Always  # Always pull latest image
        ports:
          - name: http
            containerPort: 7860
            protocol: TCP
        
        # Environment variables from ConfigMap and Secret
        envFrom:
          - configMapRef:
              name: langflow-config
          - secretRef:
              name: langflow-secret
        
        # Volume mounts for data persistence
        volumeMounts:
          - name: langflow-data
            mountPath: /app/langflow
          - name: langflow-logs
            mountPath: /app/logs
        
        # Resource limits
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        # Liveness probe - restart if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: 7860
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness probe - remove from service if not ready
        readinessProbe:
          httpGet:
            path: /health
            port: 7860
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Startup probe - allow extra time for initial startup
        startupProbe:
          httpGet:
            path: /health
            port: 7860
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 300 seconds total
      
      volumes:
        - name: langflow-data
          persistentVolumeClaim:
            claimName: langflow-data-pvc
        - name: langflow-logs
          persistentVolumeClaim:
            claimName: langflow-logs-pvc
      
      nodeSelector:
        reltype: prod
      
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-api-prod-service
  namespace: prod
  labels:
    app: langflow-api-prod
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 7860
  selector:
    app: langflow-api-prod
