# Optional: Ingress for external access
# Uncomment and configure if you want to expose Langflow externally
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langflow-ingress
  namespace: prod
  labels:
    app: langflow-api-prod
  annotations:
    # Uncomment and modify based on your ingress controller
    # For nginx ingress:
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    
    # For SSL/TLS (cert-manager):
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/tls-acme: "true"
spec:
  # ingressClassName: nginx  # Uncomment and specify your ingress class
  rules:
  - host: langflow.yourdomain.com  # CHANGE THIS to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langflow-api-prod-service
            port:
              number: 80
  # Uncomment for HTTPS/TLS
  # tls:
  # - hosts:
  #   - langflow.yourdomain.com
  #   secretName: langflow-tls-secret

