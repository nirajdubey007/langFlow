apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-data-pvc
  namespace: prod
  labels:
    app: langflow-api-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Uncomment and specify if you have a specific storage class
  # storageClassName: your-storage-class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-logs-pvc
  namespace: prod
  labels:
    app: langflow-api-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Uncomment and specify if you have a specific storage class
  # storageClassName: your-storage-class

