apiVersion: v1
kind: Secret
metadata:
  name: langflow-secret
  namespace: prod
  labels:
    app: langflow-api-prod
type: Opaque
stringData:
  # Admin credentials - CHANGE THESE BEFORE DEPLOYING!
  LANGFLOW_SUPERUSER: "admin"
  LANGFLOW_SUPERUSER_PASSWORD: "ChangeThisPassword123!"
  
  # Secret key for sessions - Generate with: openssl rand -hex 32
  LANGFLOW_SECRET_KEY: "CHANGE_THIS_TO_A_RANDOM_SECRET_KEY_BEFORE_DEPLOY"
  
  # Optional: Add API keys here if needed
  # OPENAI_API_KEY: "your-openai-key"
  # ANTHROPIC_API_KEY: "your-anthropic-key"

