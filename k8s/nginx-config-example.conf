# NGINX Configuration for Langflow AKS Deployment
# This file shows how to configure NGINX to proxy to the Langflow ClusterIP service

# Option 1: If NGINX is in the same AKS cluster
upstream langflow_backend {
    # Use Kubernetes service DNS name (recommended)
    server langflow-api-prod-service.prod.svc.cluster.local:80;
    
    # Or use ClusterIP directly (less flexible)
    # server 10.0.0.100:80;  # Replace with actual ClusterIP
    
    # Load balancing (if multiple replicas)
    # server langflow-api-prod-service.prod.svc.cluster.local:80 weight=1;
    # server langflow-api-prod-service.prod.svc.cluster.local:80 weight=1;
    
    # Health checks (requires nginx-plus or custom module)
    # keepalive 32;
}

# Option 2: If NGINX is external (VM or another service)
# You need to expose Langflow service as LoadBalancer first
# upstream langflow_backend {
#     server <LOADBALANCER_IP>:80;  # Get from: kubectl get svc langflow-api-prod-service -n prod
# }

server {
    listen 80;
    server_name your-domain.com;  # Change to your domain or use _ for default
    
    # Increase body size for file uploads
    client_max_body_size 50M;
    
    # Logging
    access_log /var/log/nginx/langflow-access.log;
    error_log /var/log/nginx/langflow-error.log;
    
    # Main location block
    location / {
        proxy_pass http://langflow_backend;
        proxy_http_version 1.1;
        
        # WebSocket support (required for Langflow)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts (important for long-running requests)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering (disable for streaming/WebSocket)
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Don't buffer responses
        proxy_cache off;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://langflow_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # API endpoints (if needed separately)
    location /api {
        proxy_pass http://langflow_backend/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

