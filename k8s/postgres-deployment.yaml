apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: prod
  labels:
    app: postgres
data:
  POSTGRES_DB: "langflow"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: prod
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "langflow"
  POSTGRES_PASSWORD: "ChangeMeToStrongPassword123!"  # CHANGE THIS!
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: prod
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: prod
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16  # Pull from Docker Hub
        imagePullPolicy: IfNotPresent
        ports:
          - name: postgres
            containerPort: 5432
            protocol: TCP
        
        env:
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_INITDB_ARGS
            value: "--encoding=UTF-8"
          - name: PGDATA
            value: "/var/lib/postgresql/data/pgdata"
        
        volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
      
      nodeSelector:
        reltype: prod
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: prod
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: postgres

